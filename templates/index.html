<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Filmes</title>
</head>
<body>
    
    <h1>Cadastro de Filmes</h1>

    <form action="/cadastrar" method="POST">

        <label for="titulo">Título:</label>
        <br><br>
        <input type="text" name="titulo" placeholder="Nome do filme" required>
        <br><br>

        <label>Gênero:</label>
        <select name="genero" id="genero" required>
            <option value="">Escolha:</option>
            <option value="Ação">Ação</option>
            <option value="Comédia">Comédia</option>
            <option value="Drama">Drama</option>
            <option value="Terror">Terror</option>
            <option value="Ficção Científica">Ficção Científica</option>
            <option value="Romance">Romance</option>
            <option value="Animação">Animação</option>
        </select><br><br>

        <label>Nota: <span id="valorNota">5</span></label>
        <br>
        <input type="range" name="nota" min="0" max="10" value="5"
            oninput="document.getElementById('valorNota').textContent = this.value">
            <br><br>
        
        <label>Ano de Lançamento:</label>
        <br><br>
        <input type="number" name="ano" id="ano" min="1900" max="2026" placeholder="2024">
        <br><br>

        <label>
            <input type="checkbox" name="assistido" value="Sim">
            Já assisti
        </label>

        <button type="submit">Cadastrar</button>

    </form>

    <h2>Filmes cadastrados</h2>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Gênero</th>
            <th>Nota</th>
            <th>Ano</th>
            <th>Assistido</th>
        </tr>
        {% for filme in filmes %}
        <tr>
            <td>{{ filme.id }}</td>
            <td>{{ filme.titulo }}</td>
            <td>{{ filme.genero }}</td>
            <td>{{ filme.nota }}</td>
            <td>{{ filme.ano }}</td>
            <td>{{ filme.assistido }}</td>
        </tr>
        {% endfor %}
    </table>
   
</body>
</html>
