<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js"></script>
    <title>Food Experience</title>
</head>
<body>
    
    <header class="cabecalho">
        <a href="#" class="logo">
            FOOD<span>EXPERIENCE</span>
        </a>

        <nav class="navegacao">
            <a href="#">Início</a>
            <a href="#cardapio">Cardápio</a>
            <a href="#sobre">Sobre</a>
        </nav>

        <button class="botao-carrinho" id="abrirCarrinho">
            🛒Carrinho
            <span id="contadorCarrinho">0</span>
        </button>
    </header>

    <main>
        <section class="banner" id="inicio">
            <div class="banner-conteudo">
                <span class="etiqueta">SABOR QUE SURPREENDE</span>

                <h1>
                    Uma experiência <br>
                    <span>para seu paladar.</span>
                </h1>
                <p>
                    Ingredientes selecionados, receitas especiais
                    e muito sabor em cada pedido.
                </p>

                <a href="#cardapio" class="botao-principal">
                    Explorar cardápio
                </a>
            </div>

            <div class="banner-imagem">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=900" alt="Hambúrguer artesanal">
            </div>

        </section>

        <section class="secao-cardapio" id="cardapio">
            
            <div class="titulo-secao">
                <span class="etiqueta">NOSSO MENU</span>
                <h2>Explore nosso cardápio</h2>
                <p>Escolha seus favoritos e aproveite!</p>
            </div>

            <div class="filtros">
                <button class="filtro ativo" data-categoria="todos">
                    Todos
                </button>

                <button class="filtro" data-categoria="pizzas">
                    Pizzas
                </button>

                <button class="filtro" data-categoria="sobremesas">
                    Sobremesas
                </button>

            </div>

            <div class="lista-produtos" id="listaProdutos">

            </div>

            <p class="mensagem-vazia" id="mensagemVazia">
                Nenhum produto encontrado.
            </p>
        </section>
        
    </main>

</body>
</html>
