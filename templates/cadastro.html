<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Cadastro | Travel Experience</title>
</head>
<body>
    
    <header>
        <h1>✈️Travel Experience</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#destinos">Destinos</a>
        </nav>
    </header>

    <main class="area-cadastro">
        <form id="formCadastro">
            <h2>Planeje sua próxima viagem!</h2>

            <label for="nome">Nome:</label><br><br>
            <input type="text" id="nome" placeholder="Digite seu nome" required><br><br>

            <label for="email">E-mail:</label><br><br>
            <input type="email" id="email" placeholder="seu@email.com" required><br><br>

            <label for="destino">Destino desejado:</label>

            <select name="destino" id="destino" required>
                <option value="">Escolha um destino</option>
                <option value="Rio De Janeiro">Rio De Janeiro</option>
                <option value="Paris">Paris</option>
                <option value="Maldivas">Maldivas</option>
            </select>
            <br><br>
            <button type="submit">Enviar Cadastro</button>
            <br><br>
            <p id="mensagem" aria-live="polite"></p>

            <a href="index.html" class="voltar">
                Voltar para o início
            </a>
        </form>
    </main>

    <footer>
        <p>Travel Experience ©2026</p>
    </footer>

    <script src="/js/script.js"></script>

</body>
</html>
