<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox - Aula 1</title>

    <style>
        body{
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    .caixa-pai{
        display: flex;
        background-color: #e5e7eb;
        height: 200px;
        margin-bottom: 30px;
        justify-content: center;
        align-items: center;
    }

    .caixa{
        background-color: #2563eb;
        color: white;
        width: 100px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 10px;
    }
    </style>

</head>
<body>
    
    <h2>Exemplo 1: flex padrão (linha)</h2>
    <div class="caixa-pai">
        <div class="caixa">1</div>
        <div class="caixa">2</div>
        <div class="caixa">3</div>
    </div>

</body>
</html>
